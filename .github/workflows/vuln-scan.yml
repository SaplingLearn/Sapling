name: Vulnerability scan

# Known-vulnerability gate over what we ship: the backend's hash-pinned
# requirements.lock (what CI, the E2E lane and the Docker image install) and
# the frontend's production npm dependencies. Runs on every PR and push to
# main, and weekly, because a new advisory can land against a lock nobody
# touched.
#
# A finding fails the job. Fix it by bumping (backend: re-lock with the
# command in requirements.lock's header, `-P <package>` to move only it;
# frontend: `npm audit fix --omit=dev` on npm 10.9.x, see frontend/.npmrc).
# When no fixed version exists yet or the bump is not safe, add a DATED,
# REASONED ignore here instead, and remove it once a fix ships:
#   backend:  add `--ignore-vuln <ID>` to the pip-audit command below, with a
#             comment `# <ID> (YYYY-MM-DD): <why it does not apply / what we wait for>`.
#   frontend: npm audit has no per-advisory ignore; pin a patched transitive
#             with `overrides` in package.json, or document the exception here.
# No ignores are active.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC (off the hour, when scheduled runs pile up).
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: the GITHUB_TOKEN is read-only unless a job
# grants itself more.
permissions:
  contents: read

concurrency:
  group: vuln-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Backend (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # The scanner itself is hash-pinned too (.github/tools/pip-audit.lock),
      # in its own venv so it never mixes with what it audits.
      - name: Install pip-audit (hash-pinned)
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --require-hashes -r .github/tools/pip-audit.lock
      # --disable-pip: the lock is fully pinned and hashed, so pip-audit reads
      # it as is instead of resolving it again in a throwaway venv.
      - name: Audit backend/requirements.lock
        run: |
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --progress-spinner off --desc \
            -r backend/requirements.lock --require-hashes --disable-pip
      - name: Audit the scanner's own lock
        run: |
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --progress-spinner off --desc \
            -r .github/tools/pip-audit.lock --require-hashes --disable-pip

  npm-audit:
    name: Frontend (npm audit, production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Same npm as ci.yml and Cloudflare's builder (frontend/.npmrc).
      - name: Pin npm to the engines-required version
        run: npm install -g npm@10.9.2 --engine-strict=false
      # Reads package-lock.json against the registry's advisory database; no
      # install, so no package scripts run. Dev-only tooling is excluded:
      # it never reaches the deployed bundle.
      - name: npm audit (high and critical fail)
        run: npm audit --omit=dev --audit-level=high
