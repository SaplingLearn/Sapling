name: Security

# The secret scan and the vulnerability scan, in ONE job. Each check takes
# seconds, and Actions bills every job rounded up to a whole minute, so a job
# per check would cost minutes for seconds of work. One red result never hides
# another (see the note on `steps:`), and the job fails if any check did.
#
# 1. Secret scan: gitleaks over the repository's FULL git history, so a secret
#    in any commit of a PR fails it, even one a later commit removed: removal
#    does not un-leak it. Config and the allowlist of known-fake values:
#    .gitleaks.toml. A real hit means rotate the credential first; rewriting
#    history or allowlisting it does not make it safe. The release binary is
#    downloaded at a pinned version and checked against its published sha256
#    (gitleaks/gitleaks-action needs a paid licence for organisation repos). To
#    bump: change GITLEAKS_VERSION and GITLEAKS_SHA256 together, from the
#    release's gitleaks_<version>_checksums.txt.
#
# 2. Vulnerability scan: known advisories against what we ship, the backend's
#    hash-pinned requirements.lock (what CI, the E2E lane and the Docker image
#    install) and the frontend's production npm dependencies. Also weekly,
#    because a new advisory can land against a lock nobody touched. Fix a
#    finding by bumping (backend: re-lock with the command in
#    requirements.lock's header, `-P <package>` to move only it; frontend:
#    `npm audit fix --omit=dev` on npm 10.9.x, see frontend/.npmrc). When no
#    fixed version exists yet or the bump is not safe, add a DATED, REASONED
#    ignore here instead, and remove it once a fix ships:
#      backend:  add `--ignore-vuln <ID>` to the pip-audit command below, with a
#                comment `# <ID> (YYYY-MM-DD): <why it does not apply / what we wait for>`.
#      frontend: npm audit has no per-advisory ignore; pin a patched transitive
#                with `overrides` in package.json, or document the exception here.
#    No ignores are active.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC (off the hour, when scheduled runs pile up).
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: the GITHUB_TOKEN is read-only unless a job
# grants itself more.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (gitleaks + pip-audit + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      # Each scan depends only on its own setup: it runs when that setup
      # worked, whatever happened to the others (`!cancelled()` overrides the
      # default "skip after any failure"). gitleaks needs no toolchain, so it
      # goes first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      # --- 1. Secret scan -------------------------------------------------
      - name: Install gitleaks (pinned, checksum-verified)
        id: gitleaks
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          "$dir/gitleaks" version
      # --verbose prints each finding (file, line, commit, rule); without it
      # a failure says only "leaks found: N". --redact keeps the value out.
      - name: "Secret scan: gitleaks over the full history"
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1

      # --- 2a. Backend advisories -----------------------------------------
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        if: ${{ !cancelled() }}
        with:
          python-version: "3.13"
      # The scanner itself is hash-pinned too (.github/tools/pip-audit.lock),
      # in its own venv so it never mixes with what it audits.
      - name: Install pip-audit (hash-pinned)
        id: pip_audit
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --require-hashes -r .github/tools/pip-audit.lock
      # --disable-pip: the lock is fully pinned and hashed, so pip-audit reads
      # it as is instead of resolving it again in a throwaway venv.
      # --timeout 60: the 15 s default timed out against PyPI on #914's run.
      - name: "Vulnerability scan: backend/requirements.lock"
        if: ${{ !cancelled() && steps.pip_audit.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --progress-spinner off --desc --timeout 60 \
            -r backend/requirements.lock --require-hashes --disable-pip
      - name: "Vulnerability scan: the scanner's own lock"
        if: ${{ !cancelled() && steps.pip_audit.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --progress-spinner off --desc --timeout 60 \
            -r .github/tools/pip-audit.lock --require-hashes --disable-pip

      # --- 2b. Frontend advisories ----------------------------------------
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      # Same npm as frontend.yml and Cloudflare's builder (frontend/.npmrc).
      - name: Pin npm to the engines-required version
        id: npm
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm install -g npm@10.9.2 --engine-strict=false
      # Reads package-lock.json against the registry's advisory database; no
      # install, so no package scripts run. Dev-only tooling is excluded:
      # it never reaches the deployed bundle.
      - name: "Vulnerability scan: npm audit (production deps, high and critical fail)"
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high
