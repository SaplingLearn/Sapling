name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# The workflow's GITHUB_TOKEN is read-only, but that is NOT this job's whole
# privilege: `id-token: write` lets claude-code-action exchange an OIDC token
# for the Claude GitHub App's installation token, which carries whatever the
# App was granted on this repo, and the run spends CLAUDE_CODE_OAUTH_TOKEN.
# The PR's diff is the agent's input, so who may open the PR is the boundary.
permissions:
  contents: read

jobs:
  claude-review:
    # Only PRs opened by someone with a role on this repo.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # The review plugin, pinned. The old marketplace URL
      # (https://github.com/anthropics/claude-code.git) was its default branch,
      # and that marketplace in turn points the plugin at
      # claude-plugins-official's `main`: code that runs with this job's
      # tokens changed whenever either repo did. claude-code-action only
      # accepts marketplace URLs ending in `.git` (no `#ref`), so the pin is
      # a checkout at a commit, used as a LOCAL marketplace; its code-review
      # entry is a relative path, so the plugin comes from the same commit.
      # Bump the sha deliberately, after reading the plugin's diff.
      - name: Check out the pinned plugin marketplace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: anthropics/claude-plugins-official
          ref: b5b01ac4f889fec0c4c6bb89f27ca7c8574473f6 # main, 2026-11-14
          path: .pinned-claude-plugins
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: './.pinned-claude-plugins'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

