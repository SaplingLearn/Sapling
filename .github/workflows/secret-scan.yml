name: Secret scan

# gitleaks over the repository's FULL git history (a few seconds here), so a
# secret in any commit of a PR fails it, even one a later commit removed:
# removal does not un-leak it. Config and the allowlist of known-fake values:
# .gitleaks.toml. A real hit means rotate the credential first; rewriting
# history or allowlisting it does not make it safe.
#
# The release binary is downloaded at a pinned version and checked against
# its published sha256 (gitleaks/gitleaks-action needs a paid licence for
# organisation repos). To bump: change GITLEAKS_VERSION and GITLEAKS_SHA256
# together, from the release's gitleaks_<version>_checksums.txt.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the GITHUB_TOKEN is read-only unless a job
# grants itself more.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          "$dir/gitleaks" version
      # --verbose prints each finding (file, line, commit, rule); without it
      # a failure says only "leaks found: N". --redact keeps the value out.
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1
