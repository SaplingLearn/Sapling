name: integration (local supabase)

# `pull_request` is deliberate and deliberately unfiltered. Until #574 this lane
# ran only after a merge, so the one gate built to catch route/schema drift was
# structurally incapable of failing a PR: #574 added a test file demanding env
# this workflow did not set, merged green, and left main red for three pushes.
# A paths filter would buy back ~5 minutes on frontend-only PRs at the cost of a
# narrower version of the same blind spot, so the whole lane runs on every PR.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Supabase's ports sit INSIDE Linux's default ephemeral source-port range
      # (32768-60999), so any outbound TCP connection this job makes can be
      # handed 54322 as its source port — and Docker's later bind of
      # 0.0.0.0:54322 then fails with "address already in use". That is what
      # killed run 32624263094 on 2026-08-23 (push to main, 9f34454c): its log
      # shows `supabase start` finishing dozens of image pulls and hitting the
      # bind error in the same second, and the identical commit re-run 40
      # minutes later passed. Rare, load-dependent, and indistinguishable from
      # a real failure in the summary view — a day of signal went to it.
      #
      # `ip_local_reserved_ports` excludes ports from AUTOMATIC assignment only;
      # explicit bind() is unaffected, so Docker can still publish them. Run
      # right after checkout — the earliest point config.toml exists — so
      # setup-python's and setup-cli's downloads are covered too. The list comes
      # from supabase/config.toml rather than a literal, so enabling the pooler
      # or moving a port cannot silently un-protect it.
      #
      # Reserving cannot free a socket allocated before this step, so the second
      # half diagnoses instead: leftover containers are removed, a foreign
      # LISTENer fails the job by name (we never kill what isn't ours), and a
      # draining outbound socket is waited out. The wait is 30s, not the full
      # 60s TIME-WAIT: a listener's SO_REUSEADDR steps over TIME-WAIT anyway,
      # the reservation is the actual fix, and this half is the diagnostic net —
      # so it warns and proceeds rather than failing on a guess.
      - name: Preflight (reserve the Supabase ports)
        working-directory: .
        run: |
          ports=$(awk -F= '
            /^[[:space:]]*#/                        { next }
            /^[[:space:]]*[a-z_]*port[[:space:]]*=/ { v = $2 + 0; if (v >= 32768 && v <= 60999) print v }
          ' supabase/config.toml | sort -un | paste -sd, -)
          if [ -z "$ports" ]; then
            echo "preflight: FAIL - no ports parsed out of supabase/config.toml"
            exit 1
          fi

          want=$(printf '%s,%s' "$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)" "$ports" \
                 | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)
          echo "preflight: ephemeral source-port range $(tr -s '[:blank:]' '-' < /proc/sys/net/ipv4/ip_local_port_range)"
          if sudo sysctl -qw "net.ipv4.ip_local_reserved_ports=$want"; then
            echo "preflight: reserved $want"
          else
            echo "preflight: WARNING - could not set net.ipv4.ip_local_reserved_ports; collisions stay possible"
          fi

          port_re=":(${ports//,/|})\$"
          pub_re=":(${ports//,/|})->"
          leftovers=$(docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' | awk -v re="$pub_re" '$0 ~ re' || true)
          if [ -n "$leftovers" ]; then
            echo "preflight: removing leftover container(s) publishing Supabase ports:"
            printf '%s\n' "$leftovers" | sed 's/^/  /'
            printf '%s\n' "$leftovers" | awk '{print $1}' | xargs -r docker rm -f
          fi

          drain_timeout=30
          waited=0
          clean=yes
          while :; do
            busy=$(sudo ss -H -tanp 2>/dev/null | awk -v re="$port_re" '$4 ~ re' || true)
            [ -n "$busy" ] || break

            listening=$(printf '%s\n' "$busy" | awk '$1 == "LISTEN"')
            if [ -n "$listening" ]; then
              echo "preflight: FAIL - a foreign process is LISTENing on a Supabase port"
              echo "  (state / recv-q / send-q / local / peer / process)"
              printf '%s\n' "$listening" | sed 's/^/  /'
              exit 1
            fi

            if [ "$waited" -eq 0 ]; then
              echo "preflight: transient socket(s) hold a Supabase port; waiting up to ${drain_timeout}s to drain:"
              printf '%s\n' "$busy" | sed 's/^/  /'
            fi
            if [ "$waited" -ge "$drain_timeout" ]; then
              echo "preflight: WARNING - still held after ${drain_timeout}s:"
              printf '%s\n' "$busy" | sed 's/^/  /'
              echo "preflight: continuing; if 'supabase start' now fails with 'address already in use', this is why."
              clean=no
              break
            fi
            sleep 2
            waited=$((waited + 2))
          done

          if [ "$clean" = yes ]; then
            echo "preflight: ports $ports free (reserved from ephemeral range)"
          else
            echo "preflight: ports $ports NOT all free (reserved from ephemeral range) - see WARNING above"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
        working-directory: .
      - name: Install deps
        run: pip install -r requirements.txt
      # Ordering is intentional: db.migrate reads SUPABASE_DB_URL inline and
      # imports no encryption, so it runs before `cp .env.local.example .env`
      # (which is what seed_local_rich needs for SUPABASE_URL + ENCRYPTION_KEY).
      - name: Migrate + seed
        run: |
          SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres python -m db.migrate
          cp .env.local.example .env
          python -m db.seed_local_rich
      # Function mode is a requirement of the lane, not a preference: the quiz
      # subcutaneous tests (#545) drive `generate`/`answer`/`submit` through real
      # HTTP, so without the seam they would call live Gemini. Their autouse
      # fixture raises rather than skips when it is unset — a skip would report
      # green having run nothing — which is what turned this step red. Set here
      # rather than in the fixture so every test in the lane sees one mode, and
      # mirroring e2e.yml, the other runner of these handlers.
      #
      # Safe to apply lane-wide: no other integration test constructs an agent,
      # so nothing here can trip UnregisteredHandlerError. `.env.local.example`
      # (copied to .env above) defines neither variable, so the integration
      # conftest's load_dotenv(override=True) cannot clobber them.
      - name: Run integration tests
        env:
          SAPLING_MODEL_MODE: function
          SAPLING_FUNCTION_HANDLERS: agents.function_handlers_e2e
        run: RUN_INTEGRATION=1 python -m pytest -m integration -q
