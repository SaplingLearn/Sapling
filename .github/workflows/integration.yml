name: integration (local supabase)

# `pull_request` is deliberate and deliberately unfiltered. Until #574 this lane
# ran only after a merge, so the one gate built to catch route/schema drift was
# structurally incapable of failing a PR: #574 added a test file demanding env
# this workflow did not set, merged green, and left main red for three pushes.
# A paths filter would buy back ~5 minutes on frontend-only PRs at the cost of a
# narrower version of the same blind spot, so the whole lane runs on every PR.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Supabase's ports sit INSIDE Linux's default ephemeral source-port range,
      # so an outbound connection this job makes can be handed 54322 as its
      # source port and Docker's later bind of 0.0.0.0:54322 then fails with
      # "address already in use" — which killed run 32624263094 on 2026-08-23
      # (push to main, 9f34454c) while the identical commit passed on re-run.
      # scripts/preflight-ports.sh carries the whole diagnosis and mechanism in
      # its header: it reserves those ports against AUTOMATIC assignment (an
      # explicit bind() still works, so Docker can publish them) and names
      # whatever already holds one. e2e.yml calls the same script.
      #
      # Placed right after checkout — the earliest point config.toml exists —
      # so setup-python's and setup-cli's downloads are covered by the
      # reservation too, not just `supabase start`'s image pulls.
      - name: Preflight (reserve the Supabase ports)
        working-directory: .
        run: scripts/preflight-ports.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        working-directory: .
        # Mirrors scripts/e2e-up.sh:219-226, the other runner of this command:
        # a stale project makes the CLI claim it is "already running" and then
        # fail, and `supabase stop` keeps the DB volume, so a retry loses
        # nothing. It also covers the preflight's admitted give-up path — the
        # collision that killed 32624263094 passed on a plain re-run.
        run: |
          if ! supabase start; then
            echo "supabase start failed — retrying once after supabase stop"
            supabase stop >/dev/null 2>&1 || true
            supabase start
          fi
      - name: Install deps
        run: pip install -r requirements.txt
      # Ordering is intentional: db.migrate reads SUPABASE_DB_URL inline and
      # imports no encryption, so it runs before `cp .env.local.example .env`
      # (which is what seed_local_rich needs for SUPABASE_URL + ENCRYPTION_KEY).
      - name: Migrate + seed
        run: |
          SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres python -m db.migrate
          cp .env.local.example .env
          python -m db.seed_local_rich
      # Function mode is a requirement of the lane, not a preference: the quiz
      # subcutaneous tests (#545) drive `generate`/`answer`/`submit` through real
      # HTTP, so without the seam they would call live Gemini. Their autouse
      # fixture raises rather than skips when it is unset — a skip would report
      # green having run nothing — which is what turned this step red. Set here
      # rather than in the fixture so every test in the lane sees one mode, and
      # mirroring e2e.yml, the other runner of these handlers.
      #
      # Safe to apply lane-wide: no other integration test constructs an agent,
      # so nothing here can trip UnregisteredHandlerError. `.env.local.example`
      # (copied to .env above) defines neither variable, so the integration
      # conftest's load_dotenv(override=True) cannot clobber them.
      - name: Run integration tests
        env:
          SAPLING_MODEL_MODE: function
          SAPLING_FUNCTION_HANDLERS: agents.function_handlers_e2e
        run: RUN_INTEGRATION=1 python -m pytest -m integration -q
