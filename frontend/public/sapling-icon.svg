<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Sapling mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="cut" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cut2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="leafL" x1="0" y1="18" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7DBBE"/><stop offset="0.5" stop-color="#6BA67B" stop-opacity="0.95"/><stop offset="1" stop-color="#3F7A52"/>
    </linearGradient>
    <linearGradient id="leafR" x1="0" y1="10" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DAEEDD"/><stop offset="0.5" stop-color="#8FC29B" stop-opacity="0.95"/><stop offset="1" stop-color="#4E8A60"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="28" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FC29B"/><stop offset="1" stop-color="#3F7A52"/>
    </linearGradient>
  </defs>

  <!-- stem: bends right at the crown and continues up into the right leaf, so leaf and stem read as one -->
  <path d="M37.5 24.6 C38.3 24.2 39 24.8 38.8 25.6 C38.6 26.2 38 26.6 37.4 27 C35.9 27.9 34.4 29.3 33.7 31.2 C33.2 34.5 33.3 38.5 33.4 42.8 C33.5 46.6 33.7 50.2 33.5 53.7 C33.4 55.2 32.7 56.1 31.9 56 C31 55.9 30.6 55 30.7 53.6 C30.9 49.9 30.8 46 30.8 42 C30.9 37.9 30.8 34 31 30.8 C31.4 28.2 33.1 26.3 35.2 25.4 C36 25 36.8 24.8 37.5 24.6Z" fill="url(#stem)"/>
  <path d="M32 38 C32 38 18 34 16 22 C16 22 30 20 32 38Z" fill="url(#leafL)" filter="url(#cut)"/>
  <path d="M32 30 C32 30 46 24 50 12 C50 12 36 12 32 30Z" fill="url(#leafR)" filter="url(#cut2)"/>
</svg>
