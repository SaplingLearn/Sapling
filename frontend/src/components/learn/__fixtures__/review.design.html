<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aleo:wght@400;600;700&amp;family=SUSE:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#445D22;text-decoration:none}a:hover{color:#384E19}
</style>
</helmet>
<div style="min-height: 980px; display: flex; flex-wrap: wrap; background: #faf8f3; font-family: 'SUSE', system-ui, sans-serif; color: #1a1814;">
  <dc-import name="Sidebar" active="review" hint-size="264px,980px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 48px 56px; box-sizing: border-box;">
    <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">
      <header style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
        <h1 style="margin: 0; flex: 1; font-family: 'Aleo', Georgia, serif; font-size: 30px; font-weight: 600;">Review</h1>
        <div role="radiogroup" aria-label="Course" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #f4f1ea;">
          <button type="button" role="radio" aria-checked="true" style="height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: #fdfcf9; font: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(25,37,11,0.06);">CS 112</button>
          <button type="button" role="radio" aria-checked="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 14px; color: #3f3b31;">All courses</button>
        </div>
      </header>

      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="flex: 1; height: 8px; border-radius: 4px; background: #ebe6dc;" role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="3" aria-label="Review progress"><div style="width: 33%; height: 8px; border-radius: 4px; background: #445D22;"></div></div>
        <span style="font-size: 14px; color: #3f3b31;">3 of 9</span>
      </div>

      <section aria-labelledby="rq-h" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 16px; background: #fdfcf9; border: 1px solid rgba(42,39,31,0.14);">
        <p style="margin: 0; font-size: 13px; color: #3f3b31;">Stacks</p>
        <h2 id="rq-h" style="margin: 0; font-family: 'Aleo', Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.45;">You push 3, 7 and 5 onto an empty stack, then pop twice. What is on top?</h2>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="ra" style="font-size: 14px; font-weight: 600;">Your answer</label>
          <input id="ra" type="text" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(42,39,31,0.18); background: #ffffff; font: inherit; font-size: 15px;">
        </div>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <legend style="float: left; margin-right: 6px; font-size: 14px; color: #3f3b31;">How sure?</legend>
          <label style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(42,39,31,0.18); font-size: 14px;"><input type="radio" name="rs" style="position: absolute; opacity: 0;">Guessing</label>
          <label style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(42,39,31,0.18); font-size: 14px;"><input type="radio" name="rs" style="position: absolute; opacity: 0;">Fairly sure</label>
          <label style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(42,39,31,0.18); font-size: 14px;"><input type="radio" name="rs" style="position: absolute; opacity: 0;">Sure</label>
        </fieldset>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button type="button" style="height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: #445D22; color: #ffffff; font: inherit; font-size: 15px; font-weight: 600;">Check answer</button>
          <button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 15px; color: #3f3b31;">I don't know</button>
        </div>
      </section>

      <section aria-labelledby="ret-h" style="display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 14px; background: #fdfcf9; border: 1px solid rgba(42,39,31,0.10);">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <h2 id="ret-h" style="margin: 0; font-size: 16px; font-weight: 600;">Retention check ready for MA 242</h2>
          <p style="margin: 0; font-size: 14px; color: #3f3b31;">Three questions on what you learned a week ago. No hints.</p>
        </div>
        <a href="Review.dc.html" style="height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid rgba(42,39,31,0.18); color: #1a1814; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center;">Start check</a>
      </section>
    </div>
  </main>
</div>
</x-dc>

</body>
</html>
