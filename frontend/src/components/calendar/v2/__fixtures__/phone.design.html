<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aleo:wght@400;600;700&amp;family=SUSE:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#445D22;text-decoration:none}a:hover{color:#2f4115}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #faf8f3; color: #1a1814; font-family: 'SUSE', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(42,39,31,0.10);">
    <button type="button" aria-label="Menu" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#1a1814" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
    <h1 style="margin: 0; flex: 1; font-family: 'Aleo', Georgia, serif; font-size: 24px; font-weight: 600;">Calendar</h1>
    <button type="button" aria-label="Import syllabus" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #445D22; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M4.5 6.5 8 3l3.5 3.5M3 13h10"/></svg></button>
  </header>

  <div style="padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 12px;">
    <div role="group" aria-label="View" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px; gap: 2px; border-radius: 12px; background: #efebe1;">
      <button type="button" aria-pressed="true" style="height: 36px; border-radius: 9px; border: 0; background: #ffffff; box-shadow: 0 1px 2px rgba(42,39,31,0.18); font: inherit; font-size: 14px; font-weight: 600; color: #1a1814;">Agenda</button>
      <button type="button" aria-pressed="false" style="height: 36px; border-radius: 9px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #4a4538;">Month</button>
      <button type="button" aria-pressed="false" style="height: 36px; border-radius: 9px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #4a4538;">Week</button>
      <button type="button" aria-pressed="false" style="height: 36px; border-radius: 9px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #4a4538;">Semester</button>
    </div>
    <div role="group" aria-label="This week" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{d.on}}" style="{{d.style}}">
          <span style="font-size: 11px; font-weight: 600;">{{d.dow}}</span>
          <span style="font-size: 16px; font-weight: 700;">{{d.n}}</span>
          <span aria-hidden="true" style="{{d.dot}}"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-family: 'Aleo', Georgia, serif; font-size: 18px; font-weight: 600;">{{g.name}} <span style="font-family: 'SUSE', system-ui, sans-serif; font-size: 13px; font-weight: 400; color: #4a4538;">{{g.range}}</span></h2>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
          <a href="#" style="{{it.rowStyle}}">
            <span style="width: 40px; display: flex; flex-direction: column; align-items: center; line-height: 1.1;">
              <span style="font-size: 11px; font-weight: 600; color: #4a4538;">{{it.dow}}</span>
              <span style="font-family: 'Aleo', Georgia, serif; font-size: 20px; font-weight: 600;">{{it.day}}</span>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 15px; font-weight: 600;">{{it.title}}</span>
              <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4a4538;"><span aria-hidden="true" style="{{it.swatch}}"></span><span style="font-weight: 600; color: #1a1814;">{{it.course}}</span>{{it.type}}</span>
            </span>
            <span style="{{it.whenStyle}}">{{it.when}}</span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { 'CS 112': '#3a6ea5', 'MA 123': '#b5602a', 'BI 108': '#2e7a6f', 'WR 120': '#7b4f93' };
    const days = [['M', 9], ['T', 10], ['W', 11], ['T', 12], ['F', 13], ['S', 14], ['S', 15]];
    const has = { 12: 'CS 112', 13: 'MA 123' };
    const week = days.map(([dow, n]) => {
      const on = n === 11;
      return {
        dow, n, on: on ? 'true' : 'false',
        style: 'height: 60px; border-radius: 12px; border: 0; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;' +
          (on ? ' background: #445D22; color: #ffffff;' : ' background: #fdfcf9; color: #1a1814; box-shadow: inset 0 0 0 1px rgba(42,39,31,0.10);'),
        dot: has[n] ? `width: 6px; height: 6px; border-radius: 999px; background: ${C[has[n]]};` : 'width: 6px; height: 6px;',
      };
    });
    const row = (dow, day, title, course, type, when, soon) => ({
      dow, day, title, course, type, when,
      swatch: `width: 8px; height: 8px; border-radius: 2px; background: ${C[course]}; display: inline-block;`,
      whenStyle: 'font-size: 13px; font-weight: 600; text-align: right;' + (soon ? ' color: #8a3b12;' : ' color: #4a4538;'),
      rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; border-radius: 14px; color: #1a1814;' +
        ' background: #fdfcf9; border: 1px solid rgba(42,39,31,0.10);',
    });
    const groups = [
      { name: 'This week', range: 'Mar 9 – 15', items: [
        row('THU', 12, 'HW 7: Hash tables', 'CS 112', 'Homework', 'Tomorrow', true),
        row('FRI', 13, 'Quiz 4', 'MA 123', 'Quiz', 'In 2 days', true),
      ] },
      { name: 'Next week', range: 'Mar 16 – 22', items: [
        row('MON', 16, 'Lab report 3', 'BI 108', 'Homework', 'In 5 days'),
        row('WED', 18, 'Essay draft', 'WR 120', 'Homework', 'In 7 days'),
        row('FRI', 20, 'Midterm 2', 'CS 112', 'Exam', 'In 9 days'),
      ] },
    ];
    return { week, groups };
  }
}
</script>
</body>
</html>
