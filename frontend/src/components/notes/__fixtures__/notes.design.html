<h2>1. What a Determinant Measures</h2>
<p>For a 2×2 matrix, the determinant is the factor by which the matrix scales area. A determinant of 3 triples every area; a determinant of −2 doubles areas and flips orientation. A determinant of <strong>0</strong> means the matrix squashes the plane onto a line or a point.</p>

<ol><li><strong>2×2 formula:</strong> for rows (a, b) and (c, d), det = ad − bc.</li><li><strong>Cofactor expansion:</strong> pick a row or column, multiply each entry by its signed minor, and add the results. Choose the row with the most zeros.</li><li><strong>Row reduction:</strong> reduce to triangular form while tracking each row operation, then multiply the diagonal entries.</li></ol>

${BLK.table(["Row operation", "Effect on det(A)", "Example"], [["Swap two rows", "Flips the sign", "det = 5 becomes −5"], ["Multiply a row by k", "Multiplies by k", "Row × 3: det × 3"], ["Add a multiple of one row to another", "No change", "R2 − 2R1: det stays 5"]])}
${BLK.toggle("Worked example: cofactor expansion on a 3×3", "Expand along the first row: det = 2·(3·1 − 2·1) − 0·(1·1 − 2·1) + 1·(1·1 − 3·1) = 2 − 2 = 0. The matrix is not invertible.")}
<h2>4. Determinants and Inverses</h2>
