# Backend linter (#193) — the analog of the frontend ESLint ratchet (#212).
#
# Every rule in `select` is enforced. The 94 pre-existing violations are
# baselined in [lint.per-file-ignores] so `ruff check .` is green today, and
# any NEW violation — in a new file, or a NEW rule category in an existing
# file — fails CI. This is a true ratchet: the baseline can only shrink.
#
# Scope is ruff's default correctness set: E4 (import placement), E7 (statement
# errors), E9 (syntax), F (pyflakes — unused imports/vars, undefined names).
# Pure style/formatting (E501 line length, whitespace, quotes) is deliberately
# NOT enforced here — that is `ruff format`'s job, and enabling it would require
# a one-shot reformat of the whole backend that would collide with every
# in-flight PR. `ruff format` is available to run manually; CI does not gate on
# it yet. (line-length below only informs the formatter when it's used.)
#
# Burning the baseline down: most entries are F401 (unused import) and F841
# (unused variable) — delete the dead import/var and remove the file's line
# from the baseline. E402 (import-not-at-top) entries are mostly intentional
# (deliberate import ordering after runtime config); leave those.

target-version = "py313"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "C901", "ASYNC", "B", "BLE"]
# B008 (function call in a default argument) flags every FastAPI `Depends()` /
# `File()` / `Body()` parameter, which is the framework's own idiom.
ignore = ["B008"]

# C901 (McCabe complexity) is the Phase 4 "no function over complexity 25"
# target of the architecture-hardening plan (#118). ruff can only baseline per
# FILE, so the C901 entries below exempt whole files; the per-FUNCTION ceilings
# live in code_size_baseline.json and are enforced by
# tests/test_code_size_ratchet.py (scripts/code_size_ratchet.py), which also
# fails if a C901 entry here outlives its last baselined function. Do not add
# C901 entries: split the function instead (docs/design/domain-modules.md).
# The one exception is the "tests/**" entry: test code is out of scope for the
# Phase 4 complexity target. The ratchet measures with `ruff --isolated`, so
# nothing in this file can hide a function from it; the same test also fails
# on any exclude / include / extend-per-file-ignores / ignore setting here that
# would hide one from plain `ruff check .`.
[lint.mccabe]
max-complexity = 25

# Baseline of pre-existing violations: E4/E7/E9/F as of 2026-06-12, plus the
# bug-finding rules added 2026-11-11 (ASYNC: blocking calls in async code;
# B: bugbear, mostly B904 `raise ... from` inside `except`; BLE001: blind
# `except Exception`). Do NOT add new entries — fix the violation instead,
# and drop a file's code here once the file is clean of it.
[lint.per-file-ignores]
